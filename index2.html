<script>
const APP_VERSION='v2026.08.03-1706';const CATEGORIES={bollo:{label:'Bollo',color:'var(--bollo)'},revisione:{label:'Revisione',color:'var(--revisione)'},assicurazione:{label:'Assicurazione',color:'var(--assicurazione)'},assistenza:{label:'Assistenza',color:'var(--assistenza)'},gomme:{label:'Gomme',color:'var(--gomme)'},tagliando:{label:'Tagliando',color:'var(--tagliando)'}};const ORDER={assicurazione:1,assistenza:2,bollo:3,revisione:4,tagliando:5,gomme:6};let cars=[],selectedCarId='all',fileSha='',currentYear=new Date().getFullYear();let config={user:localStorage.getItem('gh_user')||'',repo:localStorage.getItem('gh_repo')||'',token:localStorage.getItem('gh_token')||''};function changeYear(d){currentYear+=d;renderTimeline()}document.addEventListener('DOMContentLoaded',()=>{setup();ver();if(!config.user||!config.repo||!config.token){openModal('modalSettings');stat('error','Token/Repo non configurati')}else fetchData()});function ver(){debugVersion.innerText=APP_VERSION;appVersionInline.innerText='Versione '+APP_VERSION}function stat(t,s){syncDot.className='dot '+t;syncText.innerText=s}function normalize(){cars.forEach(c=>{if(!Array.isArray(c.expiries))c.expiries=[];if(typeof c.archived==='undefined')c.archived=false})}function activeCars(){const show=showArchivedCars?.checked;return cars.filter(c=>show?!c.deleted:!c.archived&&!c.deleted)}async function fetchData(){stat('syncing','Sincronizzazione...');try{const r=await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/data.json`,{headers:{Authorization:`Bearer ${config.token}`,Accept:'application/vnd.github.v3+json'}});if(!r.ok)throw new Error('read');const d=await r.json();fileSha=d.sha;const txt=new TextDecoder('utf-8').decode(Uint8Array.from(atob(String(d.content||'').replace(/\s/g,'')),c=>c.charCodeAt(0)));cars=JSON.parse(txt);normalize();stat('online','Sincronizzato con GitHub');render()}catch(e){console.error(e);stat('error','Errore di sincronizzazione')}}async function save(){stat('syncing','Salvataggio...');try{const enc=btoa(unescape(encodeURIComponent(JSON.stringify(cars,null,2))));const r=await fetch(`https://api.github.com/repos/${config.user}/${config.repo}/contents/data.json`,{method:'PUT',headers:{Authorization:`Bearer ${config.token}`,'Content-Type':'application/json',Accept:'application/vnd.github.v3+json'},body:JSON.stringify({message:'Aggiornamento scadenze da Web App',content:enc,sha:fileSha})});if(!r.ok)throw new Error('write');const d=await r.json();fileSha=d.content.sha;stat('online','Sincronizzato con GitHub');render()}catch(e){console.error(e);alert('Impossibile salvare su GitHub.');stat('error','Errore salvataggio')}}function render(){normalize();renderCars();renderKPI();renderTimeline();renderDetail()}function renderCars(){const visible=activeCars();carCountBadge.innerText=visible.length;let h=`<div class="car ${selectedCarId==='all'?'active':''}" onclick="selectCar('all')"><div><div class="car-name">Tutte le Auto</div><div class="car-plate">Vista Globale</div></div></div>`;h+=visible.map(c=>`<div class="car ${c.archived?'archived':''} ${selectedCarId===c.id?'active':''}" onclick="selectCar('${c.id}')"><div><div class="car-name">${esc(c.name)} ${c.archived?'<span class="badge badge-archived">archiviata</span>':''}</div><div class="car-plate">${esc(c.plate)}</div></div><div class="car-actions"><button class="icon" onclick="event.stopPropagation();editCar('${c.id}')">✎</button><button class="icon" onclick="event.stopPropagation();archiveCar('${c.id}')">${c.archived?'↺':'⊟'}</button></div></div>`).join('');carList.innerHTML=h}function selectCar(id){selectedCarId=id;const c=cars.find(x=>x.id===id);dashboardCarTitle.innerText=id==='all'?'Tutte le Auto':(c?.name||'');dashboardCarSubtitle.innerText=id==='all'?'Panoramica generale':`${c?.plate||''}${c?.archived?' · archiviata':''}`;render()}function allExp(){let out=[];activeCars().forEach(c=>{if(selectedCarId==='all'||selectedCarId===c.id)c.expiries.forEach(e=>out.push({...e,carId:c.id,carName:c.name,carPlate:c.plate}))});return out}function renderKPI(){const xs=allExp();const n=new Date();n.setHours(0,0,0,0);let u=0,c=0;xs.forEach(e=>{const d=Math.ceil((new Date(e.date)-n)/86400000);if(d>=0&&d<=30)u++;if(d>=0&&d<=90)c+=Number(e.cost)||0});kpiUrgentCount.innerText=u;kpiCost90.innerText=`${c} €`}function renderTimeline(){coverageYearLabel.innerText=currentYear;const mn=['Gen','Feb','Mar','Apr','Mag','Giu','Lug','Ago','Set','Ott','Nov','Dic'];coverageMonths.innerHTML=`<div class="head"><div>Auto / Scadenze</div><div class="mhead">${mn.map(m=>`<span>${m}</span>`).join('')}</div><div>GG</div></div>`;const y0=new Date(currentYear,0,1),y1=new Date(currentYear,11,31,23,59,59),today=new Date();today.setHours(0,0,0,0);const pct=d=>Math.min(98,Math.max(1,((d-y0)/(y1-y0))*100));const rows=allExp().map(exp=>{const s=new Date(exp.date),e=exp.endDate?new Date(exp.endDate):s;return{exp,s,e,period:!!exp.endDate}}).filter(r=>r.period?(r.e>=y0&&r.s<=y1):(r.s.getFullYear()===currentYear)).sort((a,b)=>(a.exp.carName||'').localeCompare(b.exp.carName||'','it')||a.s-b.s);if(!rows.length){coverageTimelineList.innerHTML=`<div style="padding:.75rem;color:var(--mu);font-size:.85rem">Nessuna copertura o scadenza nel ${currentYear}.</div>`;return}const g={};rows.forEach(r=>(g[r.exp.carName||'Senza auto']||(g[r.exp.carName||'Senza auto']=[])).push(r));let h='';Object.keys(g).sort((a,b)=>a.localeCompare(b,'it')).forEach(car=>{const gr=g[car];gr.sort((a,b)=>(ORDER[a.exp.type]||999)-(ORDER[b.exp.type]||999)||a.s-b.s||a.e-b.e);h+=`<div class="group"><div class="gtitle">🚗 ${esc(String(car).replace(/^Auto\s*/i,''))} <span class="gcount">${gr.length}</span></div><div class="line"></div><div></div></div>`;gr.forEach(r=>{const c=CATEGORIES[r.exp.type]||{label:r.exp.type,color:'var(--ac)'};const days=Math.ceil((r.e-today)/86400000);let visual;if(r.period){const l=pct(r.s<y0?y0:r.s),rr=pct(r.e>y1?y1:r.e),w=Math.max(2,rr-l);visual=`<div class="track"><div class="bar" style="left:${l}%;width:${w}%;background:${c.color}"></div>${r.e<=y1?`<div class="point" style="left:${rr}%;background:${c.color}"></div>`:''}</div>`}else{const p=pct(r.s);visual=`<div class="track"><div class="point" style="left:${p}%;background:${c.color}"></div></div>`}h+=`<div class="row child" onclick="editExp('${r.exp.id}')"><div class="name"><span class="cat-dot" style="background:${c.color}"></span>${esc(c.label)}</div><div>${visual}</div><div class="day">${days<0?Math.abs(days)+' scad.':days}</div></div>`})});coverageTimelineList.innerHTML=h}function renderDetail(){const xs=allExp().sort((a,b)=>new Date(a.date)-new Date(b.date));expiryList.innerHTML=xs.length?xs.map(e=>{const c=CATEGORIES[e.type]||{label:e.type,color:'var(--ac)'};return`<div class="expiry" onclick="editExp('${e.id}')"><div class="expiry-t"><span class="cat-dot" style="background:${c.color}"></span>${c.label}</div><div class="expiry-d">${esc(e.carName)} (${esc(e.carPlate)})</div><div class="expiry-d">Data: ${fmt(e.date)} ${e.endDate?'→ '+fmt(e.endDate):''}</div><div class="expiry-f"><b>${e.cost?e.cost+' €':''}</b><button class="btn danger sm" onclick="event.stopPropagation();delExp('${e.id}')">Elimina</button></div></div>`}).join(''):`<div style="font-size:.8rem;color:var(--mu)">Nessuna scadenza inserita.</div>`}function newCar(){formCar.reset();carId.value='';modalCarTitle.innerText='Aggiungi Auto';btnArchiveCar.style.display='none';btnUnarchiveCar.style.display='none';openModal('modalCar')}function editCar(id){const c=cars.find(x=>x.id===id);if(!c)return;modalCarTitle.innerText='Modifica Auto';carId.value=c.id;carName.value=c.name||'';carPlate.value=c.plate||'';carArchived.checked=!!c.archived;btnArchiveCar.style.display=c.archived?'none':'inline-flex';btnUnarchiveCar.style.display=c.archived?'inline-flex':'none';openModal('modalCar')}function archiveCar(id){const c=cars.find(x=>x.id===id);if(!c)return;c.archived=!c.archived;if(selectedCarId===id&&c.archived)selectedCarId='all';save()}function delExp(id){if(confirm('Eliminare questa scadenza?')){cars.forEach(c=>c.expiries=c.expiries.filter(e=>e.id!==id));save()}}function editExp(id){let e=null,cid=null;cars.forEach(c=>{const x=c.expiries.find(y=>y.id===id);if(x){e=x;cid=c.id}});if(!e)return;populateCars(cid);modalExpiryTitle.innerText='Modifica Scadenza';expiryId.value=e.id;expiryCarId.value=cid;expiryType.value=e.type;expiryCost.value=e.cost||'';expiryDate.value=e.date;expiryEndDate.value=e.endDate||'';expiryNotes.value=e.notes||'';openModal('modalExpiry')}function populateCars(def){expiryCarId.innerHTML=activeCars().map(c=>`<option value="${c.id}">${esc(c.name)} (${esc(c.plate)})</option>`).join('');if(def)expiryCarId.value=def}function openModal(id){document.getElementById(id).classList.add('open')}function closeModal(id){document.getElementById(id).classList.remove('open')}function setup(){btnSettings.onclick=()=>{ghUser.value=config.user;ghRepo.value=config.repo;ghToken.value=config.token;openModal('modalSettings')};formSettings.onsubmit=e=>{e.preventDefault();config.user=ghUser.value.trim();config.repo=ghRepo.value.trim();config.token=ghToken.value.trim();localStorage.setItem('gh_user',config.user);localStorage.setItem('gh_repo',config.repo);localStorage.setItem('gh_token',config.token);closeModal('modalSettings');fetchData()};btnOpenAddCar.onclick=newCar;showArchivedCars.onchange=()=>{selectedCarId='all';render()};btnArchiveCar.onclick=()=>{if(carId.value)archiveCar(carId.value);closeModal('modalCar')};btnUnarchiveCar.onclick=()=>{if(carId.value)archiveCar(carId.value);closeModal('modalCar')};btnOpenAddExpiry.onclick=()=>{if(!activeCars().length)return alert('Aggiungi o ripristina prima un\'auto attiva.');formExpiry.reset();expiryId.value='';populateCars(selectedCarId!=='all'?selectedCarId:null);openModal('modalExpiry')};document.querySelectorAll('.closeModalBtn').forEach(b=>b.onclick=()=>['modalCar','modalExpiry','modalSettings'].forEach(closeModal));formCar.onsubmit=e=>{e.preventDefault();const id=carId.value,n=carName.value.trim(),p=carPlate.value.trim().toUpperCase(),a=carArchived.checked;if(!n||!p)return;if(cars.some(c=>c.id!==id&&String(c.plate).toUpperCase()===p))return alert('Questa targa esiste già.');if(id){const c=cars.find(x=>x.id===id);if(c){c.name=n;c.plate=p;c.archived=a;if(a&&selectedCarId===id)selectedCarId='all'}}else cars.push({id:'car-'+Date.now(),name:n,plate:p,archived:a,expiries:[]});save();closeModal('modalCar')};formExpiry.onsubmit=e=>{e.preventDefault();const id=expiryId.value,cid=expiryCarId.value,obj={id:id||'exp-'+Date.now(),type:expiryType.value,cost:parseFloat(expiryCost.value)||0,date:expiryDate.value,endDate:expiryEndDate.value,notes:expiryNotes.value.trim()};if(id)cars.forEach(c=>c.expiries=c.expiries.filter(x=>x.id!==id));const c=cars.find(x=>x.id===cid);if(c)c.expiries.push(obj);save();closeModal('modalExpiry')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');const t=b.dataset.target;sidebar.classList.remove('mobile-active');mainContent.classList.add('mobile-hidden');detailPanel.classList.remove('mobile-active');if(t==='sidebar')sidebar.classList.add('mobile-active');else if(t==='mainContent')mainContent.classList.remove('mobile-hidden');else detailPanel.classList.add('mobile-active')})}function fmt(d){if(!d)return'';const p=d.split('-');return `${p[2]}/${p[1]}/${p[0]}`}function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
</script></body></html>
